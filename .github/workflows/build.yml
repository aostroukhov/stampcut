name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Download FFmpeg (BtbN win64 gpl)
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile ffmpeg.zip -UseBasicParsing; $ok = $true; Write-Host "Скачан $u"; break } catch { Write-Host "Не удалось: $u" }
          }
          if (-not $ok) { throw "FFmpeg не скачался" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force tools/ffmpeg | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName "ffmpeg.exe") tools/ffmpeg/
          Copy-Item (Join-Path $exe.DirectoryName "ffprobe.exe") tools/ffmpeg/
          $lic = Get-ChildItem ffmpeg-tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName tools/ffmpeg/LICENSE-ffmpeg.txt }
          & tools/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          $filters = & tools/ffmpeg/ffmpeg.exe -hide_banner -filters
          if (-not ($filters -match " zscale ")) { throw "В сборке ffmpeg нет фильтра zscale (HDR→SDR)" }

      - name: Unit tests
        run: dotnet test tests/StampCut.Core.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish (self-contained, single file)
        run: |
          dotnet publish src/StampCut.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o dist/StampCut
          dotnet publish src/StampCut.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o dist/StampCut

      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/StampCut/tools/ffmpeg | Out-Null
          Copy-Item tools/ffmpeg/*.exe dist/StampCut/tools/ffmpeg/
          if (Test-Path tools/ffmpeg/LICENSE-ffmpeg.txt) { Copy-Item tools/ffmpeg/LICENSE-ffmpeg.txt dist/StampCut/tools/ffmpeg/ }
          Copy-Item -Recurse presets dist/StampCut/presets-examples
          Copy-Item README.md dist/StampCut/
          Copy-Item -Recurse docs dist/StampCut/docs
          Compress-Archive -Path dist/StampCut/* -DestinationPath dist/StampCut-portable-win-x64.zip -Force
          Get-ChildItem dist/StampCut | Format-Table Name, Length

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /DSourceDir="$PWD\dist\StampCut" /DOutDir="$PWD\dist" installer/StampCut.iss

      - uses: actions/upload-artifact@v4
        with:
          name: StampCut-win-x64
          path: |
            dist/StampCut-portable-win-x64.zip
            dist/StampCut-Setup-*.exe
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StampCut-portable-win-x64.zip
            dist/StampCut-Setup-*.exe
